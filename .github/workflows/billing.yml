name: billing

on:
  pull_request:
    paths: ["billing/**", ".github/workflows/billing.yml"]
  push:
    branches: [main, dev]
    paths: ["billing/**", ".github/workflows/billing.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: billing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      # ubuntu-latest ships a Docker daemon, which Testcontainers uses for PostgreSQL.
      - run: ./gradlew build

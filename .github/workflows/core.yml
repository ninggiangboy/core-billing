name: core

# billing and tenant include core as a separate build, which compiles it but never runs its tests.
on:
  pull_request:
    paths: ["core/**", ".github/workflows/core.yml"]
  push:
    branches: [main, dev]
    paths: ["core/**", ".github/workflows/core.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build

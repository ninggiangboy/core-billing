name: tenant

on:
  pull_request:
    paths: ["tenant/**", "core/**", ".github/workflows/tenant.yml"]
  push:
    branches: [main, dev]
    paths: ["tenant/**", "core/**", ".github/workflows/tenant.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tenant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew checkNoBillingDependency build

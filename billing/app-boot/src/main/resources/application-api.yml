# The HTTP edge. No background jobs are created in this profile; every request either reads or writes through a
# use case whose transaction is short. A generous lock_timeout is deliberate: waiting for a wallet row is the
# normal way two charges on one wallet serialise, and this edge must wait long enough to see the first finish.
spring:
  flyway:
    enabled: false
  datasource:
    hikari:
      maximum-pool-size: ${BILLING_API_DB_POOL_SIZE:20}
      minimum-idle: ${BILLING_API_DB_MIN_IDLE:5}
      connection-init-sql: "SET lock_timeout = '30s'; SET idle_in_transaction_session_timeout = '60s'"
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  shutdown: graceful
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

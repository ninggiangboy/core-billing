# The HTTP edge. No background jobs are created in this profile; every request either reads or writes through a
# use case whose transaction is short. A generous lock_timeout is deliberate: waiting for a wallet row is the
# normal way two charges on one wallet serialise, and this edge must wait long enough to see the first finish.
#
# Virtual threads and the short connection timeout belong together. A wait for Stripe or Keycloak is cheap on a
# virtual thread, so a slow provider no longer occupies a request thread. A wait for a database connection is
# different: the pool stays at 20, so the short timeout ends that wait in a fast 503 with Retry-After instead of
# queueing requests for 30s. The worker deliberately does not enable virtual threads (see application-worker.yml).
spring:
  config:
    activate:
      # The api runtime running alone. Dev and test activate api and worker together, where the base
      # application.yml stands in for both; applying this file there would leak virtual threads and a short
      # connection timeout into a process that also owns the jobs.
      on-profile: "api & !worker"
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: false
  datasource:
    hikari:
      maximum-pool-size: ${BILLING_API_DB_POOL_SIZE:20}
      minimum-idle: ${BILLING_API_DB_MIN_IDLE:5}
      # Short on purpose (milliseconds, Hikari's own unit): a request that cannot get a connection is refused,
      # not held.
      connection-timeout: 3000
      connection-init-sql: "SET lock_timeout = '30s'; SET idle_in_transaction_session_timeout = '60s'"
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  shutdown: graceful
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

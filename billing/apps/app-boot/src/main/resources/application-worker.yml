# The background edge. It has no business controllers and owns every scheduled job. A short lock_timeout turns a
# contended coordination row into a skipped tick instead of a worker stuck behind someone else's transaction.
spring:
  config:
    activate:
      # The worker runtime running alone. Dev and test activate api and worker together, where the base
      # application.yml stands in for both; applying this file there would leak a 5s lock_timeout and eight-way
      # tenant parallelism into a process that also serves HTTP.
      on-profile: "worker & !api"
  flyway:
    enabled: false
  datasource:
    hikari:
      maximum-pool-size: ${BILLING_WORKER_DB_POOL_SIZE:10}
      minimum-idle: ${BILLING_WORKER_DB_MIN_IDLE:2}
      connection-init-sql: "SET lock_timeout = '5s'; SET idle_in_transaction_session_timeout = '60s'"
  task:
    scheduling:
      # One thread per scheduled method (nine today), so a long round such as ledger verification or Stripe
      # reconciliation cannot hold up the outbox relay or the webhook sender behind it. Concurrency against the
      # database is still bounded by billing.jobs.tenant-parallelism below, not by this pool.
      pool:
        size: ${BILLING_WORKER_SCHEDULER_POOL_SIZE:9}
      shutdown:
        await-termination: true
        await-termination-period: 30s
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  shutdown: graceful
billing:
  jobs:
    # At most this many tenants run at once across all jobs; keep it below the pool size so a job never starves
    # the others of connections. 8 = maximum-pool-size 10 minus 2.
    tenant-parallelism: ${BILLING_WORKER_TENANT_PARALLELISM:8}
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

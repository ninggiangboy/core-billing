spring:
  application:
    name: core-billing
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${BILLING_OIDC_ISSUER_URI:http://localhost:8081/realms/corebilling}
          jwk-set-uri: ${BILLING_OIDC_JWK_SET_URI:${BILLING_OIDC_ISSUER_URI:http://localhost:8081/realms/corebilling}/protocol/openid-connect/certs}
          audiences: core-billing
  task:
    scheduling:
      # Money jobs, the outbox relay and the webhook sender run side by side; a slow receiver must not stall the rest.
      pool:
        size: 4
  datasource:
    url: ${BILLING_DB_URL:jdbc:postgresql://localhost:5432/corebilling}
    username: ${BILLING_DB_USER:corebilling_app}
    password: ${BILLING_DB_PASSWORD}
  flyway:
    locations: classpath:db/migration
    # Migrations run as the table owner; the application runs as corebilling_app.
    url: ${BILLING_MIGRATION_DB_URL:${BILLING_DB_URL:jdbc:postgresql://localhost:5432/corebilling}}
    user: ${BILLING_MIGRATION_DB_USER:corebilling}
    password: ${BILLING_MIGRATION_DB_PASSWORD}
    placeholders:
      appDbPassword: ${BILLING_DB_PASSWORD}

billing:
  tenancy:
    # Platform Administration is platform.<base-domain>; a Tenant is <tenant-code>.<base-domain>.
    base-domain: ${BILLING_BASE_DOMAIN:localhost}
  keycloak:
    base-url: ${BILLING_KEYCLOAK_URL:http://localhost:8081}
    realm: corebilling
    admin-client-id: billing-admin
    admin-client-secret: ${BILLING_KEYCLOAK_ADMIN_CLIENT_SECRET}
  bootstrap:
    # Optional: creates the first Platform administrator on start when the email is set and unused.
    platform-admin-email: ${BILLING_BOOTSTRAP_ADMIN_EMAIL:}
    platform-admin-temporary-password: ${BILLING_BOOTSTRAP_ADMIN_TEMPORARY_PASSWORD:}
  secrets:
    # Master key for secrets at rest (webhook signing secrets, Stripe keys): base64 of 32 random bytes, e.g. `openssl rand -base64 32`.
    master-key: ${BILLING_SECRETS_MASTER_KEY}
    master-key-id: ${BILLING_SECRETS_MASTER_KEY_ID:k1}
  outbox:
    poll-delay: PT1S
    batch-size: 100
    max-attempts: 10
    backoff-base: PT10S
    backoff-cap: PT1H
  rate-limit:
    # A worker removes buckets idle past their TTL in bounded skip-locked batches; api instances only spend them.
    cleanup-batch: 500
    cleanup-delay: PT5M
  webhooks:
    # Development only: allows http and loopback or private destinations so a local receiver works.
    allow-insecure-targets: ${BILLING_WEBHOOKS_ALLOW_INSECURE_TARGETS:false}
    # Set to false to stop sending; deliveries stay queued and go out when it is switched back on.
    sender-enabled: true
    poll-delay: PT2S
    batch-size: 25
    max-attempts: 10
    backoff-base: PT30S
    backoff-cap: PT6H
    lease: PT2M
    connect-timeout: PT3S
    read-timeout: PT10S
    deadline: PT15S

  invoicing:
    # How Postpaid charges are grouped into invoices: calendar periods in UTC (DAILY, WEEKLY, MONTHLY, QUARTERLY, YEARLY).
    postpaid-cycle: MONTHLY
    cycle-batch: 100
    cycle-delay: PT5M
    renewal-batch: 100
    renewal-delay: PT1M
    # A period that cannot be charged is retried after base * 2^(attempt-1), capped. After max-attempts Billing stops
    # trying on its own and leaves the subscription past due; it never stops anything for the Tenant.
    renewal-max-attempts: 5
    renewal-backoff-base: PT1H
    renewal-backoff-cap: P1D
    # Switch off to stop closing periods into invoices and renewing subscriptions; charges stay collected and subscriptions
    # stay due, and both catch up when it is back on.
    jobs-enabled: true

  payments:
    # The public address of this deployment, as Stripe reaches it. Webhook URLs shown to Tenants are built from it.
    public-base-url: ${BILLING_PUBLIC_BASE_URL:http://localhost:8080}
    # Where Stripe sends the customer after Checkout. {PAYMENT_ID} is replaced; the page only shows a result,
    # since the wallet changes when Stripe's webhook arrives and never because of this redirect.
    checkout-success-url: ${BILLING_PAYMENT_SUCCESS_URL:http://localhost:5173/top-up/done?payment={PAYMENT_ID}}
    checkout-cancel-url: ${BILLING_PAYMENT_CANCEL_URL:http://localhost:5173/top-up/canceled?payment={PAYMENT_ID}}
    # How long a refund holds the unspent balance while Stripe works on it. Seven days is the most the money
    # context allows; a refund Stripe settles after that finds the hold gone and is debited only if the wallet
    # still has the balance (otherwise the event is flagged for a person).
    refund-hold: P7D
    event-max-attempts: 8
    event-backoff-base: PT30S
    event-backoff-cap: PT6H
    event-batch-size: 25
    event-retry-delay: PT15S
    # Switch both background jobs off to roll back to taking no new Stripe results from polling; webhooks still work.
    jobs-enabled: true
    reconcile-lookback: P3D
    reconcile-delay: PT1H
    stripe:
      # Blank means Stripe's real API. Tests point it at a local fake.
      api-base: ${BILLING_STRIPE_API_BASE:}
      connect-timeout: PT5S
      read-timeout: PT30S
      webhook-tolerance: PT5M
    # Stripe Connect is offered only when both values are set: the Platform's own Stripe key and Connect webhook secret.
    connect:
      platform-secret-key: ${BILLING_STRIPE_CONNECT_SECRET_KEY:}
      webhook-secret: ${BILLING_STRIPE_CONNECT_WEBHOOK_SECRET:}
      onboarding-return-url: ${BILLING_STRIPE_CONNECT_RETURN_URL:http://localhost:5173/settings/payments?connect=return}
      onboarding-refresh-url: ${BILLING_STRIPE_CONNECT_REFRESH_URL:http://localhost:5173/settings/payments?connect=refresh}

management:
  endpoints:
    web:
      exposure:
        include: health

  /api/v1/customers/{id}:
    get:
      tags:
      - "customer-controller"
      operationId: "get"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CustomerResponse"
      x-required-permission: "customer:read"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
      security:
      - apiKey: []
    put:
      tags:
      - "customer-controller"
      operationId: "update"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"

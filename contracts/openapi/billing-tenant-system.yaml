---
openapi: "3.1.0"
info:
  title: "Core Billing API - Tenant Systems"
  version: "v1"
  description: "The API a Tenant System calls with the credential Billing issued to\
    \ it.\nBase URL: https://{tenant-code}.{base-domain} - the hostname selects the\
    \ Tenant.\nAuthentication: `Authorization: Bearer cbk_<key-id>_<secret>`. The\
    \ credential's scopes are the `x-required-permission` codes below; an operation\
    \ outside those scopes answers 403.\nSend `Idempotency-Key` where the operation\
    \ documents it.\nEvery resource is limited to the Customers mapped to this Tenant\
    \ System. A resource owned by another Tenant System in the same Tenant answers\
    \ 404 exactly like a resource that does not exist.\nOperations not listed here\
    \ are not available to a Tenant System."
servers:
- url: "https://{tenant-code}.{base-domain}"
  variables:
    tenant-code:
      default: "tenant-a"
    base-domain:
      default: "base-domain.com"

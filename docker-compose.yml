# Local development services. Integration tests use Testcontainers and do not need this file.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: corebilling
      POSTGRES_USER: corebilling
      POSTGRES_PASSWORD: corebilling
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:

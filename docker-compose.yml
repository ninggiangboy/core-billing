# Local development services. Integration tests use Testcontainers and do not need this file.
# Copy .env.example to .env and fill the values in before running `docker compose up`.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: corebilling
      POSTGRES_USER: corebilling
      POSTGRES_PASSWORD: ${BILLING_MIGRATION_DB_PASSWORD:?set it in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?set it in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?set it in .env}
      # Substituted into ops/keycloak/realm-export.json when the realm is imported.
      BILLING_ADMIN_CLIENT_SECRET: ${BILLING_KEYCLOAK_ADMIN_CLIENT_SECRET:?set it in .env}
    ports:
      - "8081:8080"
    volumes:
      - ./ops/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

volumes:
  postgres-data:

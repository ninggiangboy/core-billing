spring:
  application:
    name: sample-tenant
  datasource:
    url: ${SAMPLE_TENANT_DB_URL:jdbc:postgresql://localhost:5433/sampletenant}
    username: ${SAMPLE_TENANT_DB_USER:sampletenant}
    password: ${SAMPLE_TENANT_DB_PASSWORD:sampletenant}
  flyway:
    locations: classpath:db/migration

server:
  port: ${SAMPLE_TENANT_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health

sampletenant:
  billing:
    # The Billing deployment this tenant integrates with. Every financial call goes here.
    base-url: ${SAMPLE_TENANT_BILLING_URL:http://localhost:8080}
    api-key: ${SAMPLE_TENANT_BILLING_API_KEY:}
    tenant-system-id: ${SAMPLE_TENANT_BILLING_SYSTEM_ID:}
    connect-timeout: PT3S
    read-timeout: PT10S
    max-attempts: 3
    retry-backoff: PT0.2S
  webhooks:
    # The signing secret Billing returned once for this tenant's webhook endpoint.
    signing-secret: ${SAMPLE_TENANT_WEBHOOK_SECRET:}
    tolerance: PT5M
  execution:
    enabled: ${SAMPLE_TENANT_EXECUTION_ENABLED:true}
    poll-delay: PT2S
    batch-size: 10
    max-attempts: 3
  resource:
    reservation-ttl: PT15M
  portal:
    # Where Billing sends the customer back to when a session names no return URL.
    return-url: ${SAMPLE_TENANT_PORTAL_RETURN_URL:http://localhost:5174/portal/return}
  bootstrap:
    # One-shot, safe to repeat. Off by default because it needs an administrator token.
    enabled: ${SAMPLE_TENANT_BOOTSTRAP_ENABLED:false}
    admin-token: ${SAMPLE_TENANT_BOOTSTRAP_ADMIN_TOKEN:}
    webhook-url: ${SAMPLE_TENANT_WEBHOOK_URL:http://localhost:8082/webhooks/billing}
    webhook-event-types: "reservation.created,reservation.expired,reservation.released,charge.succeeded,charge.failed,payment.succeeded,payment.failed,refund.succeeded,invoice.created,invoice.paid,subscription.renewed,subscription.payment_failed"
  identity:
    session-ttl: PT12H
